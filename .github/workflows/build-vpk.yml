name: Build Gangstar Rio VPK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-vpk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Gangstar Rio source
        uses: actions/checkout@v4
        with:
          repository: brenu/gangstar-rio-vita
          path: source

      - name: Pull VitaSDK Docker image
        run: docker pull vitasdk/vitasdk-softfp:nightly

      - name: Repair upstream CMake option array
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.sh")
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "DGANGSTAR_VERTEX_PATCH_CACHE=" in line)
          end = next(i for i, line in enumerate(lines) if "DGANGSTAR_HOST_OPT_LEVEL=" in line)
          for i in range(start, end):
              lines[i] = lines[i].rstrip().rstrip("\\\\")
              lines[i] += " \\\\"
          lines[end] = lines[end].rstrip().rstrip("\\\\")
          p.write_text("\\n".join(lines) + "\\n")
          PY
          bash -n build.sh

      - name: Diagnose VitaSDK softfp probe
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/source:/workspace" \
            -w /workspace \
            vitasdk/vitasdk-softfp:nightly \
            bash -lc 'export VITASDK=/usr/local/vitasdk; python3 tools/preflight.py || { echo "===== softfp probe log ====="; cat work/preflight/softfp.log || true; exit 1; }'

      - name: Build VPK with VitaSDK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/source:/workspace" \
            -w /workspace \
            vitasdk/vitasdk-softfp:nightly \
            bash -lc 'export VITASDK=/usr/local/vitasdk; bash build.sh'

      - name: Verify VPK exists
        run: |
          test -s source/work/build/gangstar_rio_wip.vpk
          ls -lh source/work/build/gangstar_rio_wip.vpk

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: gangstar-rio-vpk
          path: source/work/build/gangstar_rio_wip.vpk
          if-no-files-found: error
          retention-days: 14
